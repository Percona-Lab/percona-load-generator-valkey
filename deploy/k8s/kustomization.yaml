# kubectl apply -k deploy/k8s   (after creating the plgv-credentials and plgv-tls secrets: see docs/deployment.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plgv
resources:
  - namespace.yaml
  - configmap.yaml
  - job-run.yaml
images:
  - name: plgv
    newName: plgv      # your registry/path
    newTag: latest     # pin a release tag
