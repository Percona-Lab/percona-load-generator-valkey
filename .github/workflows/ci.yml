name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Check and Race Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Format, vet, and unit tests
        run: make check

      - name: Race detector
        run: make test-race

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Web UI DOM tests
        run: make test-ui

  integration:
    name: Integration Tests (Valkey standalone)
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      PLGV_IT_VALKEY_ADDR: 127.0.0.1:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Integration tests (standalone)
        run: make test-integration

      - name: Start a 6-node cluster
        run: make valkey-cluster-up

      - name: Integration tests (cluster, with a forced failover)
        run: make test-integration-cluster

      - name: Start sentinel (primary, replica, three sentinels)
        run: make valkey-sentinel-up

      - name: Integration tests (sentinel, with a forced failover)
        run: make test-integration-sentinel

      - name: Start the TLS + ACL server
        run: make valkey-tls-up

      - name: Integration tests (TLS, mutual TLS and ACL users)
        run: make test-integration-tls

  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  package:
    name: Cross-build and container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Release archives for every platform
        run: make dist

      - name: Container image builds
        run: make docker-build

